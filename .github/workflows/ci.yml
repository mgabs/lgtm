name: LGTM CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write

jobs:
  quality-gate:
    name: Quality Gate & Test Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --verbose -- --nocapture

      - name: Run Code Coverage Gate (>= 90%)
        run: ./scripts/coverage.sh 90.0

      - name: Run Mutation Testing Gate (>= 90%)
        run: ./scripts/mutate.sh 90.0

      - name: Generate Security & Test Guard SARIF Report
        run: cargo run -- ci --format sarif --output lgtm-results.sarif

      - name: Upload SARIF Security Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        with:
          sarif_file: lgtm-results.sarif
          category: lgtm-security-guard

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Package Release Binary
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f2)
          ARCH=$(uname -m)
          OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')
          TAR_NAME="lgtm-v${VERSION}-${OS_NAME}-${ARCH}.tar.gz"
          tar -czf "$TAR_NAME" -C target/release lgtm
          shasum -a 256 "$TAR_NAME" > "${TAR_NAME}.sha256"
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Release Asset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgtm-${{ matrix.os }}-tarball
          path: |
            lgtm-*.tar.gz
            lgtm-*.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [quality-gate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Version
        id: get_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "lgtm v${{ steps.get_version.outputs.VERSION }} — Fast Real-Time Terminal Diff Reviewer"
          body: |
            ## 🚀 lgtm v${{ steps.get_version.outputs.VERSION }} Release
            
            **Fast, real-time terminal diff reviewer & AI agent steering TUI built in Rust.**
            
            ### What's New
            - **Zero-Dependency Homebrew Distribution**: Standalone pre-compiled static binary bundling OpenSSL & libgit2.
            - **Vim Motion Engine**: Full `j/k`, `gg/G`, `0/$`, `{/}`, `]f/[f`, `]h/[h`, `]c/[c`, `]w/[w`, `]u/[u`, `zz/zt/zb`, `/`, `n/N`, `*`, `#`, `y`, `PgUp/PgDn`.
            - **Neovim-Style Ex Commands**: `:w`, `:q`, `:wq`, `:pr <num>`, `:prs`, `:pane`, `:files`, `:split`, `:risk`, `:<line_num>` with wildmenu `<Tab>` autocompletion.
            - **Security & Test Guard**: AST & regex detection for SQLi, command injection, secret leakage, TLS bypass, and test neutering.
            - **GitHub PR Review Mode**: Review GitHub PRs directly (`lgtm pr <num>`), write inline directives, batch compile, and submit via `gh pr review`.
            - **Headless CI & Security Audits**: `lgtm risk` and `lgtm ci` with SARIF 2.1.0 and GitHub Actions annotations.
            - **Test Coverage & Mutation Testing**: $\ge 90\%$ line coverage and mutation test gate.
            
            ### Assets & Checksums
            Pre-compiled binary packages for Linux (`x86_64`) and macOS (`arm64`/`x86_64`) are attached below.
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

