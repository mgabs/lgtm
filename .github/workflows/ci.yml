name: LGTM CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write

# Runner & Environment Maintenance (Issue #28):
# - Node.js 20 deprecation: forced onto Node 24 via ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION
# - Ubuntu runner: tracking migration of ubuntu-latest label to Ubuntu 26 (actions/runner-images/issues/14748)
# - macOS runner: macos-latest (arm64) subject to queue constraints
env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Quality Gate & Test Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check Crate Boundaries
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./scripts/check-boundaries.sh

      - name: Run Unit & Integration Tests
        shell: bash
        run: cargo test --workspace --verbose -- --nocapture

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce Line Coverage Threshold (90%)
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 90 --summary-only

      - name: Generate Security & Test Guard SARIF Report
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -- check --format sarif --output lgtm-results.sarif

      - name: Upload SARIF Security Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        with:
          sarif_file: lgtm-results.sarif
          category: lgtm-security-guard

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Package Release Binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f2)
          ARCH=$(uname -m)
          OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')
          TAR_NAME="lgtm-v${VERSION}-${OS_NAME}-${ARCH}.tar.gz"
          tar -czf "$TAR_NAME" -C target/release lgtm
          shasum -a 256 "$TAR_NAME" > "${TAR_NAME}.sha256"
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: Package Release Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f2)
          ZIP_NAME="lgtm-v${VERSION}-windows-x86_64.zip"
          powershell -Command "Compress-Archive -Path target/release/lgtm.exe -DestinationPath $ZIP_NAME -Force"
          powershell -Command "(Get-FileHash -Algorithm SHA256 $ZIP_NAME).Hash.ToLower() + '  ' + '$ZIP_NAME'" > "${ZIP_NAME}.sha256"

      - name: Upload Release Asset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgtm-${{ matrix.os }}-bundle
          path: |
            lgtm-*.tar.gz
            lgtm-*.zip
            lgtm-*.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release & Update Homebrew Tap
    needs: [quality-gate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Version
        id: get_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "lgtm v${{ steps.get_version.outputs.VERSION }} — Real-Time Terminal Diff Reviewer & Agent Steering Engine"
          body: |
            ## 🚀 lgtm v${{ steps.get_version.outputs.VERSION }} Release

            **Fast, real-time terminal diff reviewer & AI agent steering TUI built in Rust.**

            ### ✨ Highlights in v${{ steps.get_version.outputs.VERSION }}
            - **CI step**: `lgtm ci --rev origin/main...HEAD`, exit codes 0/1/2, and a composite GitHub Action with SARIF upload.
            - **Azure DevOps PRs**: list, diff, policy checks, threads, post, reply, resolve and votes via `az`; `##vso` annotations and an Azure Pipelines recipe for `lgtm ci`.
            - **Inline thread markers**: `◆`/`◇` in the gutter and `]t`/`[t` to jump between remote threads.
            - **Orphaned comments**: comments re-pin when code moves, are flagged `⚠ Orphaned`, and `:directives orphans` lists, re-pins or drops them.
            - **Native Model Context Protocol (MCP) Server**: Autonomous AI agent stdio server (`lgtm serve --mcp` / `lgtm mcp`).
            - **Arbitrary Git Revision Range Diffing**: `lgtm main..feat`, `lgtm HEAD~3..HEAD`, and in-TUI `:diff <rev>`.
            - **Interactive Hunk & Visual Line Staging**: `s`, `u`, `x`, and `V` sub-hunk staging into the Git index.
            - **Tree-Sitter AST Code Folding & Sticky Scope**: `zf/zo/zc/zR/zM` and `📍 Scope: fn ...` header.
            - **Quick Steering Directive Chords**: `ca` (coverage), `cs` (security), `cr` (refactor), `cp` (perf), `cw` (why).
            - **Guardrail Ignore Directives**: Support for `// lgtm:ignore`, `# lgtm:ignore`, and `#[cfg(test)]` auto-exclusion.
            - **Interactive Commit Forge**: `C` modal to craft conventional commits directly in TUI.
            - **Full Wiki & User Manual**: Complete documentation in `docs/WIKI.md`.
            - **Native Windows Support**: Cross-platform path normalization, batch wrapper resolution (`az.cmd`, `code.cmd`), and CRLF invariance.

            ### Assets & Checksums
            Pre-compiled binary packages for Linux (`x86_64`), macOS (`arm64`/`x86_64`), and Windows (`x86_64`) are attached below.
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap Formula (mgabs/homebrew-tap)
        if: success()
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.TAP_GITHUB_TOKEN || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.HOMEBREW_TOKEN || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          DARWIN_ARM64_SHA=$(shasum -a 256 release-artifacts/*darwin*arm64*.tar.gz 2>/dev/null | awk '{print $1}' | head -1)
          [ -z "$DARWIN_ARM64_SHA" ] && DARWIN_ARM64_SHA=$(shasum -a 256 release-artifacts/*darwin*.tar.gz 2>/dev/null | awk '{print $1}' | head -1)

          LINUX_X86_64_SHA=$(shasum -a 256 release-artifacts/*linux*x86_64*.tar.gz 2>/dev/null | awk '{print $1}' | head -1)
          [ -z "$LINUX_X86_64_SHA" ] && LINUX_X86_64_SHA=$(shasum -a 256 release-artifacts/*linux*.tar.gz 2>/dev/null | awk '{print $1}' | head -1)

          echo "Updating Homebrew Tap for v${VERSION}..."
          echo "darwin-arm64 sha256: ${DARWIN_ARM64_SHA}"
          echo "linux-x86_64 sha256: ${LINUX_X86_64_SHA}"

          if [ -z "$DARWIN_ARM64_SHA" ] || [ -z "$LINUX_X86_64_SHA" ]; then
            echo "::warning::Missing Darwin or Linux SHA256 checksums, skipping Homebrew tap update."
            exit 0
          fi

          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::No token found for Homebrew tap formula update."
            exit 0
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mgabs/homebrew-tap.git" tap_repo || {
            echo "::warning::Failed to clone homebrew-tap repository (check permissions/token)."
            exit 0
          }

          mkdir -p tap_repo/Formula

          cat << 'EOF' > tap_repo/Formula/lgtm.rb
          class Lgtm < Formula
            desc "Fast, real-time terminal diff reviewer & AI agent steering TUI built in Rust"
            homepage "https://github.com/mgabs/lgtm"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/mgabs/lgtm/releases/download/vVERSION_PLACEHOLDER/lgtm-vVERSION_PLACEHOLDER-darwin-arm64.tar.gz"
                sha256 "DARWIN_ARM64_SHA_PLACEHOLDER"
              else
                url "https://github.com/mgabs/lgtm/releases/download/vVERSION_PLACEHOLDER/lgtm-vVERSION_PLACEHOLDER-darwin-arm64.tar.gz"
                sha256 "DARWIN_ARM64_SHA_PLACEHOLDER"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/mgabs/lgtm/releases/download/vVERSION_PLACEHOLDER/lgtm-vVERSION_PLACEHOLDER-linux-x86_64.tar.gz"
                sha256 "LINUX_X86_64_SHA_PLACEHOLDER"
              end
            end

            def install
              bin.install "lgtm"
            end

            test do
              assert_match "Real-Time Terminal Diff Reviewer", shell_output("#{bin}/lgtm --help")
            end
          end
          EOF

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" tap_repo/Formula/lgtm.rb
          sed -i "s/DARWIN_ARM64_SHA_PLACEHOLDER/${DARWIN_ARM64_SHA}/g" tap_repo/Formula/lgtm.rb
          sed -i "s/LINUX_X86_64_SHA_PLACEHOLDER/${LINUX_X86_64_SHA}/g" tap_repo/Formula/lgtm.rb

          cd tap_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lgtm.rb

          TARGET_BRANCH="main"
          git show-ref --verify --quiet refs/heads/master && TARGET_BRANCH="master"

          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(lgtm): bump formula to v${VERSION}"
            git push origin "$TARGET_BRANCH" || echo "::warning::Failed to push Homebrew formula update to $TARGET_BRANCH."
          else
            echo "Homebrew formula already up to date."
          fi
